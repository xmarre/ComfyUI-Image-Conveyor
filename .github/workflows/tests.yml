name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install --upgrade pillow

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Run gallery math tests
        run: node --test tests/test_gallery_math.mjs

      - name: Check JavaScript syntax
        run: |
          node --check web/image_conveyor.js
          node --check web/image_conveyor_math.mjs

      - name: Check Python syntax
        run: python -m py_compile __init__.py image_conveyor.py image_conveyor_server.py

      - name: Check whitespace errors
        run: git diff --check HEAD^

name: apply context-menu multi-selection fix

on:
  push:
    branches: [agent/fix-context-menu-multi-add]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('web/image_conveyor.js')
          text = path.read_text(encoding='utf-8')
          old = "    addAction('Add to Conveyor', () => addLibraryEntries(node, [item]))"
          new = """    const selected = activeBrowser(ctx)?.selected
              const addSelection = selected instanceof Set && selected.has(options.itemId)
              addAction('Add to Conveyor', () => (
                addSelection
                  ? addSelectedLibraryEntries(node)
                  : addLibraryEntries(node, [item])
              ))"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one context-menu add action, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          node --check web/image_conveyor.js

      - name: Commit focused result
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-context-menu-multi-add.yml
          git add web/image_conveyor.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix context menu multi-selection add"
          git push origin "HEAD:${GITHUB_REF_NAME}"
